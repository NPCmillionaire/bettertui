[project]
name = "bettertui"
version = "0.1.0"
description = "A friendlier TUI front-end for bettercap, driving it over its REST API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
]

[project.scripts]
bettertui = "bettertui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bettertui"]
